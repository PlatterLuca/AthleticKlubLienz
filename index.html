<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athletic Klub Lienz</title>
    <meta name="description" content="Athletic Klub Lienz – Wir sind jetzt ein offizieller Verein." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet" />

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(0, 0, 0, 0.05) 3px,
                rgba(0, 0, 0, 0.05) 4px
            );
            pointer-events: none;
            z-index: 10;
        }

        #stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 1;
            padding: 2rem;

            opacity: 0;
            transform: scale(0.93);
            animation: fadeInScale 1s ease-out 0.1s forwards;
        }

        @keyframes fadeInScale {
            to { opacity: 1; transform: scale(1); }
        }

        #name-row {
            position: relative;
            display: inline-block;
            line-height: 1;
        }

        #main-text {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(32px, 5.5vw, 68px);
            font-weight: 700;
            color: #fff;
            letter-spacing: 4px;
            text-transform: uppercase;
            white-space: pre;
        }

        #underline {
            position: absolute;
            bottom: -5px;
            left: 50%;
            right: 50%;
            height: 2px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 2px;
            transition: left 0.9s ease, right 0.9s ease;
        }

        #tagline {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(11px, 1.4vw, 15px);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-top: 32px;

            opacity: 0;
            transform: translateY(14px);
            transition: opacity 1s ease, transform 1s ease;
        }

        #tagline.visible { opacity: 1; transform: translateY(0); }

        #message {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(12px, 1.35vw, 15px);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            line-height: 1.75;
            margin-top: 14px;
            max-width: 520px;

            opacity: 0;
            transform: translateY(10px);
            transition: opacity 1s ease 0.2s, transform 1s ease 0.2s;
        }

        #message.visible { opacity: 1; transform: translateY(0); }

        #message strong {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 700;
        }

        #site-link {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(13px, 1.7vw, 19px);
            font-weight: 700;
            color: #fff;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            margin-top: 30px;
            padding: 11px 26px;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-radius: 4px;
            display: inline-block;

            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1s ease 0.4s, transform 1s ease 0.4s,
                        border-color 0.25s, background 0.25s;
        }

        #site-link.visible { opacity: 1; transform: translateY(0); }

        #site-link:hover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.07);
        }
    </style>
</head>
<body>

    <div id="stage">
        <div id="name-row">
            <span id="main-text">Athletic BinBlau</span>
            <div id="underline"></div>
        </div>

        <div id="tagline">Wir sind jetzt offiziell</div>

        <div id="message">
            Aus Athletic BinBlau wird der <strong>Athletic Klub Lienz</strong>
        </div>

        <a id="site-link" href="https://AthleticKlubLienz.com" target="_blank">
            AthleticKlubLienz.com
        </a>
    </div>

    <script>
    (() => {
        const PREFIX     = "Athletic ";
        const OLD_SUFFIX = "BinBlau";
        const NEW_SUFFIX = "Klub Lienz";
        const DEL_MS     = 130;
        const TYPE_MS    = 100;

        const mainText = document.getElementById("main-text");
        const underline= document.getElementById("underline");
        const tagline  = document.getElementById("tagline");
        const message  = document.getElementById("message");
        const siteLink = document.getElementById("site-link");

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function run() {
            await sleep(1100);
            await sleep(900);

            for (let i = OLD_SUFFIX.length; i >= 0; i--) {
                mainText.textContent = PREFIX + OLD_SUFFIX.slice(0, i);
                if (i > 0) await sleep(DEL_MS);
            }

            await sleep(800);

            for (let i = 1; i <= NEW_SUFFIX.length; i++) {
                mainText.textContent = PREFIX + NEW_SUFFIX.slice(0, i);
                await sleep(TYPE_MS);
            }

            await sleep(50);
            underline.style.left  = "0";
            underline.style.right = "0";

            await sleep(700);
            tagline.classList.add("visible");
            await sleep(300);
            message.classList.add("visible");
            await sleep(200);
            siteLink.classList.add("visible");
        }

        document.fonts.ready.then(run);
    })();
    </script>
</body>
</html>
